name: Linux Build

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  linux-build:
    name: Linux (minimal=${{ matrix.minimal }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        minimal: ['ON', 'OFF']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Display build information
        run: |
          echo "Building CEF for Linux"
          echo "Generator: Unix Makefiles (default)"
          echo "Architecture: $(uname -m)"
          echo "Linux version: $(lsb_release -d | cut -f2)"
          echo "Available disk space: $(df -h . | tail -1 | awk '{print $4}')"
      
      - name: Check network connectivity
        run: |
          echo "Testing network connectivity to CEF builds..."
          curl -I https://cef-builds.spotifycdn.com/ || echo "Direct connection failed, but this is expected"
          echo "Network test completed"
      
      - name: Install X11 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgtk-3-dev \
            libnss3-dev \
            libasound2-dev
      
      - name: Setup virtual display
        run: |
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Wait a moment for Xvfb to start
          sleep 2
      
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.27.9'
      
      - name: Configure
        run: cmake -B build -S . -DCEF_ROBUST_DOWNLOAD=ON -DCEF_USE_MINIMAL_DIST=${{ matrix.minimal }} -DCMAKE_BUILD_TYPE=Release
      
      - name: Build all tests
        run: cmake --build build --config Release
      
      - name: Run all CEF tests with CTest
        run: cd build/test && ctest -C Release --verbose
      
      - name: Configure and build examples against the downloaded CEF
        shell: bash
        run: |
          cmake -S example -B build-example -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_CEF_BINARIES="$GITHUB_WORKSPACE/build/_deps/cef_binaries-src"
          cmake --build build-example --config Release --parallel 2 --target simple_app simple_test example_cef_app
          ctest --test-dir build-example -C Release -R '^cef_example_deployment$' --output-on-failure

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-build-linux-${{ matrix.minimal }}-${{ github.sha }}
          path: |
            build/test/**/*test*
          retention-days: 7
