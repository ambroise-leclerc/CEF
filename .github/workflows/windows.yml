name: Windows Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main ]

jobs:
  windows-build:
    name: Windows (minimal=${{ matrix.minimal }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        minimal: ['ON', 'OFF']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Display build information
        run: |
          echo "🪟 Building CEF for Windows"
          echo "Generator: Visual Studio 17 2022"
          echo "Architecture: $env:PROCESSOR_ARCHITECTURE"
          echo "Windows version: $(Get-WmiObject -Class Win32_OperatingSystem | Select-Object -ExpandProperty Caption)"
          echo "Available disk space: $((Get-PSDrive C | Select-Object -ExpandProperty Free) / 1GB) GB"
        shell: powershell
      
      - name: Check network connectivity
        run: |
          echo "Testing network connectivity to CEF builds..."
          curl -I https://cef-builds.spotifycdn.com/ || echo "Direct connection failed, but this is expected"
          echo "Network test completed"
        shell: bash
      
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.27.9'
      
      - name: Configure
        run: cmake -B build -S . -G "Visual Studio 17 2022" -DCEF_ROBUST_DOWNLOAD=ON -DCEF_USE_MINIMAL_DIST=${{ matrix.minimal }} -DCMAKE_BUILD_TYPE=Release
        shell: bash
      
      - name: Build all tests
        run: cmake --build build --config Release
        shell: bash
      
      - name: Run all CEF tests with CTest
        run: cd build/test && ctest -C Release --verbose
        shell: bash
      
      - name: Configure and build examples against the downloaded CEF
        shell: bash
        run: |
          cmake -S example -B build-example -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_CEF_BINARIES="$GITHUB_WORKSPACE/build/_deps/cef_binaries-src"
          cmake --build build-example --config Release --parallel 2 --target simple_app simple_test example_cef_app
          ctest --test-dir build-example -C Release -R '^cef_example_deployment$' --output-on-failure

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-build-windows-${{ matrix.minimal }}-${{ github.sha }}
          path: |
            build/test/**/*test*
          retention-days: 7
